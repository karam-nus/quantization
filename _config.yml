title: "Quantization — The Complete Guide"
description: "From the Affine Map to the Accelerator: how deep networks are compressed into integers, why it works, when it breaks, and what actually runs faster. CNNs and LLMs, calibration through kernels."
baseurl: "/quantization"
url: "https://karam-nus.github.io"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

include:
  - README.md

